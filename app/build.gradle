plugins {
    id 'com.android.application'
}

android {
    namespace 'com.suffixfix.xposed'
    compileSdk 36

    defaultConfig {
        applicationId 'com.suffixfix.xposed'
        minSdk 31
        targetSdk 36
        versionCode 6
        versionName '3.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
